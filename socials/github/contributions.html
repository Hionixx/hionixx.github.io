<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Contributions</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d1117;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            gap: 16px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #f0f6fc;
            text-align: center;
        }

        hr {
            border: 0;
            border-top: 1px solid #30363d;
            width: 100%;
            max-width: 900px;
        }

        .snake-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: center;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
        }

        .github-btn {
            margin-top: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            color: #c9d1d9;
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            text-decoration: none;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .github-btn:hover {
            background-color: #30363d;
            border-color: #8b949e;
            color: #f0f6fc;
        }
    </style>
</head>
<body>
    <h1>Hionix Contributions</h1>

    <hr/>

    <div class="snake-container">
        <picture>
            <source media="(prefers-color-scheme: dark)" srcset="https://raw.githubusercontent.com/hionixx/hionixx/workflow/github-contribution-grid-snake-dark.svg" />
            <source media="(prefers-color-scheme: light)" srcset="https://raw.githubusercontent.com/hionixx/hionixx/workflow/github-contribution-grid-snake.svg" />
            <img alt="github-snake" src="https://raw.githubusercontent.com/hionixx/hionixx/workflow/github-contribution-grid-snake.svg" />
        </picture>
    </div>

    <hr/>

    <a href="./index.html" class="github-btn">
        View GitHub
    </a>
</body>
</html>
